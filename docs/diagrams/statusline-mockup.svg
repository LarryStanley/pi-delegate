<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 580" width="900" height="580" xmlns="http://www.w3.org/2000/svg"
     font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

  <!-- Sized for GitHub's README column (~830px), not for a full-width screenshot. A wider
       canvas is scaled down there, and 13.5px type at 1160 wide arrives as 9.7px — which is
       how the first version of this became unreadable on the page it was drawn for.
       No external font import: an SVG rendered as an image cannot load one, so every glyph
       position is an explicit coordinate rather than a text run the font metrics decide. -->

  <rect width="900" height="580" fill="#0a0a0a"/>

  <!-- ================================ window chrome ================================ -->
  <rect x="28" y="24" width="844" height="486" rx="10" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
  <path d="M 28 34 a 10 10 0 0 1 10 -10 h 824 a 10 10 0 0 1 10 10 v 22 h -844 z" fill="#1b1b1b"/>
  <line x1="28" y1="56" x2="872" y2="56" stroke="#2b2b2b" stroke-width="1"/>
  <circle cx="52" cy="40" r="4.5" fill="#5c5c5c"/>
  <circle cx="70" cy="40" r="4.5" fill="#5c5c5c"/>
  <circle cx="88" cy="40" r="4.5" fill="#5c5c5c"/>
  <text x="450" y="45" fill="#5c5c5c" font-size="12" text-anchor="middle">claude — ~/code/api</text>

  <!-- ================================== transcript ================================== -->
  <g font-size="15">
    <text x="52" y="94"  fill="#f5f5f5">&gt; refactor the token-refresh path in the auth middleware</text>

    <text x="52" y="132" fill="#9a9a9a">● Read src/auth/middleware.js, src/auth/refresh.js</text>
    <text x="52" y="160" fill="#9a9a9a">● Wrote tasks/auth-refresh.md — the contract, not the code</text>

    <text x="52" y="198" fill="#f5f5f5">● pi_dispatch(task_file: "tasks/auth-refresh.md")</text>
    <text x="70" y="226" fill="#5c5c5c">└ dispatched · session 7f3a2c</text>

    <text x="52" y="264" fill="#9a9a9a">● pi is writing it. I'll take the verdict with pi_result</text>
    <text x="70" y="292" fill="#9a9a9a">and check it against the acceptance script.</text>
  </g>

  <!-- ================================= prompt box ================================= -->
  <rect x="44" y="324" width="812" height="42" rx="8" fill="#111111" stroke="#2b2b2b" stroke-width="1"/>
  <text x="62" y="351" fill="#5c5c5c" font-size="15">&gt;</text>
  <rect x="80" y="337" width="9" height="18" fill="#5c5c5c"/>

  <!-- ================================= status line ================================= -->
  <!-- Row 0 is whatever status line the user already had; pi-delegate runs it untouched and
       prints beneath it. Deliberately a plain one — any particular theme would read as a
       requirement. -->
  <text x="52" y="398" fill="#5c5c5c" font-size="15" xml:space="preserve">~/code/api   main*   Opus 5   38%</text>

  <!-- pi rows. Column geometry mirrors scripts/statusline.sh: "● pi", the elapsed right-aligned
       in a 9-wide field, two spaces, the model. Sorted oldest first. The one saturated colour in
       the image is the overdue row, because that is the single thing the row exists to say. -->
  <g font-size="15">
    <text x="52"  y="430" fill="#9a9a9a">●</text>
    <text x="70"  y="430" fill="#5c5c5c">pi</text>
    <text x="169" y="430" fill="#ff5a36" text-anchor="end">18m22s</text>
    <text x="187" y="430" fill="#f5f5f5">Qwen3.8-27B-Instruct-MLX</text>

    <text x="52"  y="458" fill="#9a9a9a">●</text>
    <text x="70"  y="458" fill="#5c5c5c">pi</text>
    <text x="169" y="458" fill="#c8963c" text-anchor="end">7m04s</text>
    <text x="187" y="458" fill="#9a9a9a">qwen3-coder-30b</text>

    <text x="52"  y="486" fill="#9a9a9a">●</text>
    <text x="70"  y="486" fill="#5c5c5c">pi</text>
    <text x="169" y="486" fill="#5c5c5c" text-anchor="end">18s</text>
    <text x="187" y="486" fill="#9a9a9a">gemma-4-26b-a4b-it-4bit</text>
  </g>

  <!-- =================================== legend =================================== -->
  <!-- Under the window rather than beside it: side notes were what forced the canvas wide
       enough that GitHub had to shrink the type. -->
  <text x="28" y="540" fill="#9a9a9a" font-size="13">The first line is your own status line, run untouched. Under it, one row per running dispatch —</text>
  <text x="28" y="560" fill="#9a9a9a" font-size="13">each with its own elapsed time, turning amber at 5 minutes and red at 15. Four rows, then “… +N more”.</text>
</svg>
