<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-delegate · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · pi-delegate</p>
    <h1>Claude never speaks the RPC protocol</h1>
    <p class="subtitle">The MCP server exists to be the thing that stays alive — it keeps holding each pi child's stdin/stdout for the life of a session.</p>

    <svg viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===================== ANNOTATION CALLOUT (editorial aside) ===================== -->
      <text x="1120" y="36" fill="#eb6c36" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="end">exists to stay alive</text>
      <path d="M 1040 44 Q 760 40 580 108" fill="none"
            stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="580" cy="108" r="2" fill="#eb6c36"/>

      <!-- ===================== ZONE: session registry (drawn before arrows/nodes) ===================== -->
      <rect x="304" y="108" width="552" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="510" y="112" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="121" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">STDIO HELD OPEN</text>

      <!-- ===================== ARROWS (behind nodes) ===================== -->

      <!-- Claude Code -> MCP server -->
      <line x1="200" y1="320" x2="320" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="212" y="298" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP · STDIO</text>

      <!-- Claude Code <-> Hooks (deny / nudge, dashed, sits beside — not in the dispatch path) -->
      <path d="M 120 280 V 128" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"
            marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="132" y="196" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="206" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENY / NUDGE</text>

      <!-- MCP server <-> pi child A (accent — the held pipe). Fanned attach point y=304 on MCP's right edge. -->
      <path d="M 520,304 H 592 Q 600,304 600,296 V 184 Q 600,176 608,176 H 680"
            fill="none" stroke="#eb6c36" stroke-width="1.4"
            marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
      <rect x="528" y="284" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="293" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HELD STDIO</text>

      <!-- MCP server <-> pi child B (same relationship, not the focal one). Fanned attach point y=336, 32px from A's. -->
      <path d="M 520,336 H 592 Q 600,336 600,344 V 368 Q 600,376 608,376 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1.2"
            marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="528" y="344" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDIO</text>

      <!-- pi child A -> Provider -->
      <path d="M 840,176 H 892 Q 900,176 900,184 V 256 Q 900,264 908,264 H 960"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="848" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API CALL</text>

      <!-- pi child B -> Provider -->
      <path d="M 840,376 H 892 Q 900,376 900,368 V 308 Q 900,300 908,300 H 960"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="848" y="384" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="393" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API CALL</text>

      <!-- ===================== NODES ===================== -->

      <!-- Hooks (aside — not in the dispatch path) -->
      <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="48" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="120" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hooks</text>
      <text x="120" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pre/PostToolUse · SessionStart</text>

      <!-- Claude Code (input / session) -->
      <rect x="40" y="280" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="280" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="297" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="120" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
      <text x="120" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session · 7 MCP tools</text>

      <!-- MCP server (focal 1) -->
      <rect x="320" y="272" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="272" width="200" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="280" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="344" y="289" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="420" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP Server</text>
      <text x="420" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node src/server.mjs</text>
      <text x="420" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">long-lived · session registry</text>

      <!-- pi child A (focal 2 — held pipe) -->
      <rect x="680" y="140" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="140" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="688" y="148" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="700" y="157" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PI</text>
      <text x="760" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pi child A</text>
      <text x="760" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi --mode rpc</text>

      <!-- pi child B (same type, not focal — several can run concurrently) -->
      <rect x="680" y="340" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="340" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="348" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="700" y="357" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PI</text>
      <text x="760" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pi child B</text>
      <text x="760" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi --mode rpc</text>

      <!-- Provider (external) -->
      <rect x="960" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="240" width="160" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="968" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="984" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="1040" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="1040" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user's own pi config</text>
      <text x="1040" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no local server required</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="560" x2="1120" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="592" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal · long-lived / held pipe</text>

      <rect x="272" y="592" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">pi child (spawned per dispatch)</text>

      <rect x="520" y="592" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="540" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Claude Code session</text>

      <rect x="704" y="592" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="724" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External provider</text>

      <line x1="880" y1="597" x2="908" y2="597" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="916" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">API call</text>

      <line x1="1004" y1="597" x2="1032" y2="597" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="1040" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hook deny / nudge</text>

    </svg>
  </div>
</body>
</html>
