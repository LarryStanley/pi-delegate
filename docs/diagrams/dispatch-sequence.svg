<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 840" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===================== LIFELINES (behind everything) =====================
           Claude=160, MCP server=480, pi child=800, Provider=1120.
           pi child's lifeline is deliberately shortened to y=684 — it is
           terminated by the server, it does not exit on its own. -->
      <line x1="160" y1="112" x2="160" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="112" x2="480" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="112" x2="800" y2="684" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1120" y1="112" x2="1120" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===================== ACTIVATION BARS =====================
           MCP server's activation spans the entire session (160→724) — deliberate:
           it is the long-lived process, so it is never "idle" the way a normal
           request/response actor would be. pi child's activation ends at 684,
           right after the server kills it in message 11. -->
      <rect x="476" y="160" width="8" height="564" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="208" width="8" height="476" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ===================== MESSAGE ARROWS ===================== -->

      <!-- M1: Claude -> MCP server -->
      <line x1="160" y1="160" x2="476" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2: MCP server -> pi child -->
      <line x1="484" y1="208" x2="796" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3: MCP server -> pi child -->
      <line x1="484" y1="256" x2="796" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4: pi child -> Provider -->
      <line x1="804" y1="304" x2="1120" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M5: pi child -> MCP server (return: stdout events) -->
      <line x1="796" y1="360" x2="484" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M6: MCP server -> Claude (return: session_id) -->
      <line x1="476" y1="408" x2="160" y2="408" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M7: Claude -> MCP server -->
      <line x1="160" y1="456" x2="476" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M8: Claude -> MCP server -->
      <line x1="160" y1="504" x2="476" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9: MCP server -> pi child (FOCAL — the steer only a held pipe can carry) -->
      <line x1="484" y1="552" x2="796" y2="552" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <!-- M10: pi child -> MCP server (return: agent_end) -->
      <line x1="796" y1="600" x2="484" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M11: MCP server self-message — verdict computed, then the child is killed -->
      <path d="M 484 648 L 520 648 L 520 680 L 484 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M12: MCP server -> Claude (final verdict) -->
      <line x1="476" y1="712" x2="160" y2="712" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===================== MESSAGE LABELS ===================== -->

      <rect x="256" y="140" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PI_DISPATCH · ASYNC</text>

      <rect x="560" y="188" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN PI --MODE RPC</text>

      <rect x="592" y="236" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDIN: PROMPT</text>

      <rect x="920" y="284" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="960" y="293" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INFERENCE</text>

      <rect x="560" y="340" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT: JSONL EVENTS</text>

      <rect x="252" y="388" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETURNS SESSION_ID</text>

      <rect x="252" y="436" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PI_STATUS · 12 READ</text>

      <rect x="288" y="484" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PI_STEER</text>

      <rect x="592" y="532" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="541" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDIN: STEER</text>

      <rect x="600" y="580" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="589" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGENT_END</text>

      <rect x="528" y="660" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="669" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT + KILL CHILD</text>

      <rect x="248" y="692" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="701" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT (~15 LINES)</text>

      <!-- ===================== ANNOTATION CALLOUTS (max 2) ===================== -->

      <!-- Callout 1: why the steer is possible at all (focal / accent) -->
      <text x="1080" y="524" fill="#eb6c36" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="end">the pipe is still open</text>
      <path d="M 1000 530 Q 900 545 800 552" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="552" r="2" fill="#eb6c36"/>

      <!-- Callout 2: pi child does not exit on its own — it is killed -->
      <text x="760" y="614" fill="#2d3142" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="end">it never exits on its own</text>
      <path d="M 760 622 Q 790 660 800 684" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="684" r="2" fill="#2d3142"/>

      <!-- ===================== ACTOR BOXES (drawn after arrows/labels) ===================== -->

      <!-- Claude (input / session) -->
      <rect x="80" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="48" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="102" y="65" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="160" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude</text>
      <text x="160" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session</text>

      <!-- MCP server (focal) -->
      <rect x="400" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="48" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="56" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="424" y="65" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="480" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP server</text>
      <text x="480" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds the pipe</text>

      <!-- pi child (spawned, plain) -->
      <rect x="720" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="728" y="56" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="740" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PI</text>
      <text x="800" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pi child</text>
      <text x="800" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi --mode rpc</text>

      <!-- Provider (external) -->
      <rect x="1040" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1040" y="48" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1048" y="56" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="1064" y="65" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="1120" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="1120" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user's own config</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="80" y1="776" x2="1200" y2="776" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="792" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="80" y="808" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="100" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal message</text>

      <rect x="228" y="804" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="240" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

      <line x1="352" y1="811" x2="380" y2="811" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="388" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">API call</text>

      <line x1="480" y1="811" x2="508" y2="811" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="516" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return event</text>

      <line x1="632" y1="811" x2="660" y2="811" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="668" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <rect x="740" y="808" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">pi child (spawned)</text>

      <rect x="920" y="808" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="940" y="816" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External provider</text>

    </svg>
